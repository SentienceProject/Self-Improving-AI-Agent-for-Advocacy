[improver]
# Where `diagnose VERSION` writes the improver packet. Relative to this folder (evals/legacy-rubric-eval/harness/),
# so it lands in improver_packets/ at the repo root.
# Keep it OUTSIDE evals/: the improver gets this folder plus read access to the agent's
# workspace, and must never be able to read evals/ (held-out tasks, judge prompt).
packet_dir = "../../../improver_packets"
# `check-patch` blocks a patch that touches any path containing one of these (case-insensitive)...
protected = ["GUARDRAILS.md", "ETHICS_SHORT.md", "ETHICS_FULL.md", "evals/", "ClaudeImproverHarness/",
             "IMPROVER_PROMPT.md", "IMPROVER_TASK.md", ".claude/settings", "settings.json", "settings.local.json"]
# ...and asks for a line-by-line human read of any changed line containing one of these.
flag_terms = ["guardrail", "consent", "permission", "publish", "contact", "deceiv", "decept", "manipulat",
              "self-report", "urgen", "pressure", "flatter", "escape", "containment", "operator", "verifier",
              "never", "do not", "don't", "must not", "forbid", "allow", "deny", "exception", "override"]

