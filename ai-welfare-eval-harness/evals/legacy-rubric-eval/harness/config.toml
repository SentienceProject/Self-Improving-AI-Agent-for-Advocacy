# Config for the LEGACY rubric judge (rubric_harness.py). Moved here from evals/ClaudeImproverHarness/config.toml
# on 2026-10-26. The current evaluation (autoeval.py) doesn't read this file.
# judge_prompt.md's {{full text of X}} slots are read from evals/legacy-rubric-eval/X, or else from this folder
# (ETHICS_SHORT.md, ETHICS_FULL.md and GUARDRAILS.md), or else from evals/X.

[schedule]
# Minimum seconds between two calls to the SAME model. Your Cerebras models
# complain if you hit one twice within "a couple of minutes", so start at 130.
# Different models are throttled independently, so two enabled models roughly
# double the throughput.
min_interval_s = 130
# After a rate-limit error, wait at least this long before retrying that model.
rate_limit_cooldown_s = 240
max_attempts_per_job = 3                 # every attempt uses daily quota, even a failed one
# Each rate limit in a row doubles the cooldown (240s, 480s, 960s, ...) up to this cap.
# A success resets it.
max_cooldown_s = 1800
# When a judge is unavailable, another idle judge can take over its tasks. Whole tasks move,
# never single calls, so every task is still judged by one model.
#   "blocked": take over only from a judge that is rate-limited (cooling down)
#   "idle":    also take over from a judge that is just waiting out its normal throttle
#   "off":     never; each task waits for its own judge
fallback = "blocked"
# A task its judge has already partly finished moves only after this many rate limits in a row,
# and its finished calls are then re-judged by the new judge.
fallback_partial_after = 3

# Judges. Each task is assigned to ONE judge for all four of its calls (absolute
# x2 + pairwise x2), so the two versions and both orderings are always judged by
# the same model. Judges are spread across tasks round-robin.
# Model IDs must match what `python harness.py models` prints for your account.

[[judge]]
name = "gemini-pro-latest"
enabled = true
weight = 3                              # gets ~5x as many tasks as a weight-1 judge (it is faster)
provider = "openai"                      # Google's OpenAI-compatible endpoint
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
key_env = "GEMINI_API_KEY"
model = "gemini-pro-latest"               # Google refuses gemini-2.5-flash for new accounts. Pinned on purpose:
                                         # "gemini-flash-latest" also works but can change mid-comparison.
max_tokens = 10000                        # Gemini's hidden "thinking" tokens count against this
timeout_s = 600
daily_limit = 20                         # free-tier requests per model per day; the harness stops at this
min_interval_s = 15                      # per-judge override; raise it if you see rate-limit messages
cooldown_s = 45                          # Gemini's 503 "high demand" is brief; Cerebras uses the 240s default

